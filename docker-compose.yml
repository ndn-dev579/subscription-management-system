services:
  db:
    image: postgres:16-alpine
    container_name: brightloop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: subscription_management
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: brightloop_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

